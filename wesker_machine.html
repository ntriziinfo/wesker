<title>Wesker Slot Machine</title>
<style>
:root{--bg:#050607;--cab:#101416;--cab2:#171d20;--line:#354146;--text:#f5f2e9;--muted:#9aa5a8;--red:#cf1729;--red2:#7d0c17;--gold:#e0bd5c;--green:#9cff5d;--cyan:#5de7ff;--lcd:#05090b}*{box-sizing:border-box}html,body{margin:0;min-width:960px;min-height:720px;background:#030405;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}body{overflow:auto;background:radial-gradient(circle at 50% 0,#2a090e 0,#07080a 470px,#030405 100%)}button{font-family:inherit}.wrap{width:960px;height:720px;margin:0 auto;padding:14px}.machine{width:932px;height:692px;display:grid;grid-template-columns:164px 1fr;gap:12px;padding:12px;border:1px solid #59343b;border-radius:8px;background:linear-gradient(180deg,#1b1e20,#080a0b 62%,#15191b);box-shadow:0 26px 80px rgba(0,0,0,.58),inset 0 0 38px rgba(207,23,41,.08)}.side{display:flex;flex-direction:column;gap:10px}.mini{height:222px;padding:12px;border:1px solid #4c5557;border-radius:7px;background:linear-gradient(180deg,#071013,#020405);box-shadow:inset 0 0 24px rgba(93,231,255,.10)}.mini .label{font-size:12px;color:var(--muted);margin-bottom:8px}.mini .main{font-size:30px;font-weight:1000;color:var(--cyan);line-height:1;text-shadow:0 0 16px rgba(93,231,255,.38)}.mini .sub{display:grid;grid-template-columns:1fr auto;gap:7px 8px;margin-top:14px;font-size:12px;color:var(--muted)}.mini .sub b{color:var(--text)}.menus{display:grid;gap:8px}.menu-btn{height:41px;border-radius:7px;border:1px solid #4c5557;background:#111719;color:var(--text);font-weight:900;cursor:pointer}.menu-btn:hover,.menu-btn.on{border-color:var(--cyan);color:var(--cyan)}.stage{display:flex;flex-direction:column;gap:10px}.lcd{height:132px;position:relative;overflow:hidden;padding:15px 18px;border:1px solid #5b3b40;border-radius:8px;background:linear-gradient(90deg,rgba(8,10,11,.20),rgba(8,10,11,.86)),url("assets/symbols/wesker_bar_5x3_alpha0_cropped.png") center/contain no-repeat,#08090a;box-shadow:inset 0 0 32px rgba(207,23,41,.15)}.mode{font-size:18px;font-weight:1000;color:var(--gold)}.message{margin-top:7px;font-size:31px;font-weight:1000;line-height:1;color:#fff;text-shadow:0 0 22px rgba(207,23,41,.42)}.effect{margin-top:8px;font-size:14px;color:#dfe7e8}.meterbar{position:absolute;left:18px;right:18px;bottom:10px;height:8px;border:1px solid rgba(255,255,255,.16);border-radius:99px;background:#050607;overflow:hidden}.meterbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));transition:width .2s}.reels{width:650px;height:330px;margin:0 auto;display:grid;grid-template-columns:198px 198px 198px;gap:9px;padding:10px;border:1px solid #606b70;border-radius:8px;background:linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.20)),url("assets/symbols/ccad9d13-4320-401a-911f-a1af6d1fbd88.png") center/cover no-repeat;box-shadow:inset 0 0 36px rgba(0,0,0,.46),0 0 24px rgba(207,23,41,.12)}.reel{height:308px;display:grid;grid-template-rows:88px 88px 88px;gap:8px;padding:10px;border:1px solid rgba(15,20,22,.86);border-radius:8px;background:rgba(3,5,6,.38);box-shadow:inset 0 0 24px rgba(0,0,0,.62)}.cell{width:176px;height:88px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:2px solid rgba(42,42,36,.78);background:linear-gradient(180deg,rgba(241,238,226,.88),rgba(183,179,166,.84));color:#111}.cell.win{box-shadow:0 0 0 3px var(--green),0 0 24px rgba(156,255,93,.58)}.sym{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;color:#fff;background:#111;border:4px solid #333;text-shadow:0 2px 3px rgba(0,0,0,.55);overflow:visible}.sym.img{width:138px;height:82px;border:0;border-radius:0;background:transparent;box-shadow:none}.sym.img img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.48))}.sym.img.seven-img{width:152px;height:94px}.sym.img.v-img{width:156px;height:88px}.sym.img.bar-img,.sym.img.an-img{width:168px;height:92px}.sym.img.bell-img{width:66px;height:66px}.sym.img.suika-img{width:63px;height:63px}.sym.img.cherry-img{width:54px;height:54px}.sym.img.replay-img{width:66px;height:66px}.v{background:linear-gradient(135deg,#f8f4d6,#b50018 46%,#151515);border-color:#e5c75a}.blank{background:rgba(8,10,9,.24);border-color:rgba(80,88,82,.35);color:transparent;text-shadow:none}.wesker{background:linear-gradient(135deg,#e8e1cb,#5d6e5a 52%,#111);border-color:#b8d774}.controls{width:650px;height:96px;margin:0 auto;display:grid;grid-template-columns:138px 104px 104px 104px 96px 54px;gap:9px;align-items:center}.btn{height:76px;border-radius:8px;border:1px solid #59666a;background:linear-gradient(180deg,#1b2224,#0d1112);color:var(--text);font-size:17px;font-weight:950;cursor:pointer}.btn:hover{border-color:var(--cyan)}.btn:disabled{opacity:.45;cursor:not-allowed}.bet{background:linear-gradient(180deg,#ff3449,#850d19);border-color:#ff6c77;color:#fff;font-size:20px}.stop{background:linear-gradient(180deg,#252d30,#090c0d);border-color:#7a8b90}.auto.on{color:var(--green);border-color:var(--green)}.skip{height:54px;font-size:13px;color:var(--gold)}.drawer{position:fixed;left:50%;top:24px;transform:translateX(-50%);width:470px;max-height:calc(100vh - 48px);overflow:auto;padding:16px;border:1px solid #4b575c;border-radius:8px;background:rgba(8,10,11,.98);box-shadow:0 24px 70px rgba(0,0,0,.64);display:none;z-index:5}.drawer.open{display:block}.drawer h2{margin:0 0 12px;font-size:18px;color:var(--gold)}.drawer h3{margin:16px 0 8px;font-size:14px;color:var(--cyan)}.meters{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13px;color:var(--muted)}.meters strong{color:var(--text)}.settings,.force{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settings button,.force button{height:34px;border-radius:6px;border:1px solid var(--line);background:#0d1214;color:var(--text);font-weight:800}.settings button.on,.force button.on{border-color:var(--cyan);color:var(--cyan)}.roles{display:grid;gap:7px}.role{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:7px;border:1px solid var(--line);border-radius:6px;background:#0b0f11;font-size:12px}.role b{text-align:right;overflow-wrap:anywhere}.log{height:240px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:#050708;padding:10px;font-size:12px;color:#dfe7e8}.log p{margin:0 0 7px}.drawer-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}.drawer-actions button{height:34px;border-radius:6px;border:1px solid var(--line);background:#111719;color:var(--text);font-weight:850}.hidden{display:none}.hint{font-size:12px;line-height:1.6;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <main class="machine">
    <aside class="side">
      <section class="mini"><div class="label">COUNTER</div><div class="main" id="miniMain">500G</div><div class="sub" id="miniSub"></div></section>
      <nav class="menus"><button class="menu-btn" data-menu="status">STATUS</button><button class="menu-btn" data-menu="setting">SETTING</button><button class="menu-btn" data-menu="force">役指定</button><button class="menu-btn" data-menu="roles">出目</button><button class="menu-btn" data-menu="log">LOG</button></nav>
    </aside>
    <section class="stage">
      <div class="lcd"><div class="mode" id="mode">通常</div><div class="message" id="resultText">BETで開始</div><div class="effect" id="effectText">500G天井 / 革命BONUS / 決戦BONUS / RUSH</div><div class="meterbar"><span id="meter"></span></div></div>
      <div class="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div></div>
      <div class="controls"><button class="btn bet" id="spinBtn">BET</button><button class="btn stop" id="stop0">1 STOP</button><button class="btn stop" id="stop1">2 STOP</button><button class="btn stop" id="stop2">3 STOP</button><button class="btn auto" id="autoBtn">AUTO</button><button class="btn skip" id="skipBtn">SKIP</button></div>
    </section>
  </main>
</div>
<aside class="drawer" id="drawer">
  <h2 id="drawerTitle">格納データ</h2>
  <div class="hint">左メニューから状態、設定、役指定、出目、ログを確認できます。Escで閉じます。</div>
  <section data-panel="status"><h3>ステータス</h3><div class="meters" id="meters"></div></section>
  <section data-panel="setting"><h3>設定</h3><div id="settingButtons" class="settings"></div></section>
  <section data-panel="force"><h3>成立役指定</h3><div id="forceButtons" class="force"></div></section>
  <section data-panel="roles"><h3>成立出目</h3><div class="roles" id="roleList"></div></section>
  <section data-panel="log"><h3>ログ</h3><div class="log" id="log"></div></section>
  <div class="drawer-actions"><button id="saveBtn">SAVE</button><button id="resetBtn">RESET</button><button id="closeDataBtn">CLOSE</button></div>
</aside>
<script>
(function(){'use strict';
var STORAGE='wesker_machine_v1';
var SYMBOLS={SEVEN:{s:'7',cls:'seven-img',img:'assets/symbols/red7_5x3_FIXED_alpha0_cropped.png',alt:'赤7'},BAR:{s:'BAR',cls:'bar-img',img:'assets/symbols/wesker_bar_5x3_alpha0_cropped.png',alt:'BAR'},BELL:{s:'ベル',cls:'bell-img',img:'assets/symbols/6a900b6c-4aaa-4599-8a81-f8a1afd7aee1.png',alt:'ベル'},REPLAY:{s:'RP',cls:'replay-img',img:'assets/symbols/replay_biohazard_mark_alpha0.png',alt:'リプレイ'},CH:{s:'CH',cls:'cherry-img',img:'assets/symbols/bfe33a88-a866-44cf-8928-02ae4f078cb3.png',alt:'チェリー'},SUIKA:{s:'瓜',cls:'suika-img',img:'assets/symbols/suika_bullet_alpha0_cropped.png',alt:'スイカ'},V:{s:'V',cls:'v-img',img:'assets/symbols/v_symbol_alpha0.png',alt:'V'},BLANK:{s:'',cls:'blank'},AN:{s:'餡',cls:'an-img',img:'assets/symbols/an_symbol_5x3_large_alpha0.png',alt:'餡BAR'},W:{s:'W',cls:'wesker'}};
var REELS={left:['SEVEN','CH','SUIKA','BELL','REPLAY','BLANK','CH','SUIKA','BELL','REPLAY','V','V','V','BELL','REPLAY','BLANK','CH','SUIKA','BELL','REPLAY'],middle:['CH','SEVEN','SUIKA','REPLAY','BELL','CH','BLANK','SUIKA','REPLAY','BELL','CH','V','SUIKA','REPLAY','BELL','CH','BLANK','SUIKA','REPLAY','BELL'],right:['SUIKA','BELL','SEVEN','REPLAY','BELL','SUIKA','BELL','BLANK','REPLAY','BELL','SUIKA','BELL','V','REPLAY','BELL','SUIKA','BELL','CH','REPLAY','BELL']};
var REEL_NAMES=['left','middle','right'];
var ROLES={REPLAY:{name:'リプレイ'},BELL:{name:'ベル'},WEAK_CHERRY:{name:'弱チェリー'},STRONG_CHERRY:{name:'強チェリー'},CERTAIN_CHERRY:{name:'確定チェリー'},SUIKA:{name:'スイカ'},CHANCE_WEAK:{name:'チャンス目弱'},CHANCE_STRONG:{name:'チャンス目強'},AN:{name:'餡揃い'},BAR:{name:'BAR揃い'},SEVEN:{name:'7揃い'}};
var SETTINGS={1:{target:85,bonus:.82,success:.82,rush:.88},2:{target:90,bonus:.92,success:.90,rush:.94},3:{target:95,bonus:1,success:1,rush:1},4:{target:101,bonus:1.08,success:1.08,rush:1.07},5:{target:108,bonus:1.18,success:1.18,rush:1.16},6:{target:115,bonus:1.30,success:1.28,rush:1.26}};
var WEIGHTS={normal:[['REPLAY',24],['BELL',36],['WEAK_CHERRY',8],['STRONG_CHERRY',2],['CERTAIN_CHERRY',.25],['SUIKA',7],['CHANCE_WEAK',4],['CHANCE_STRONG',1.2],['AN',.25],['BAR',.12],['SEVEN',.08]],high:[['REPLAY',22],['BELL',34],['WEAK_CHERRY',11],['STRONG_CHERRY',4],['CERTAIN_CHERRY',.3],['SUIKA',8],['CHANCE_WEAK',7],['CHANCE_STRONG',2.8],['AN',.4],['BAR',.18],['SEVEN',.12]],bonus:[['REPLAY',18],['BELL',46],['WEAK_CHERRY',8],['STRONG_CHERRY',4],['CERTAIN_CHERRY',.5],['SUIKA',8],['CHANCE_WEAK',6],['CHANCE_STRONG',2.5],['AN',.45],['BAR',.25],['SEVEN',.18]],rush:[['REPLAY',18],['BELL',50],['WEAK_CHERRY',8],['STRONG_CHERRY',4],['CERTAIN_CHERRY',.45],['SUIKA',7],['CHANCE_WEAK',5],['CHANCE_STRONG',2],['AN',.35],['BAR',.2],['SEVEN',.15]],judge:[['REPLAY',20],['BELL',38],['WEAK_CHERRY',12],['STRONG_CHERRY',8],['CERTAIN_CHERRY',1],['SUIKA',10],['CHANCE_WEAK',8],['CHANCE_STRONG',4],['AN',1],['BAR',.6],['SEVEN',.4]]};
var state={setting:3,credit:300,totalG:0,normalG:0,mode:'normal',highRemain:0,comebackRemain:0,lastRush:'rush',bonusG:0,bonusPt:0,bonusGuaranteed:false,vStock:0,regBells:0,rushG:0,rushSet:0,rushPt:0,rushStock:0,driveG:0,harakiriG:0,payout:0,invest:0,lastRole:null,forceRole:null,spinning:false,stopped:[true,true,true],grid:null,logs:[],auto:false,autoTimers:[],activeMenu:'status'};
try{var saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved)state=Object.assign(state,saved,{spinning:false,stopped:[true,true,true],grid:null,auto:false,autoTimers:[]});if(!SETTINGS[state.setting])state.setting=3;}catch(e){}
var $=function(id){return document.getElementById(id);};var R=[].slice.call(document.querySelectorAll('.reel'));
function spec(){return SETTINGS[state.setting]||SETTINGS[3];}
function esc(v){return String(v).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
function symHtml(o){if(o.img)return '<div class="sym img '+o.cls+'"><img src="'+esc(o.img)+'" alt="'+esc(o.alt||o.s)+'"></div>';return '<div class="sym '+o.cls+'">'+esc(o.s)+'</div>';}
function choose(table){var total=table.reduce(function(a,b){return a+b[1];},0),r=Math.random()*total;for(var i=0;i<table.length;i++){r-=table[i][1];if(r<=0)return table[i][0];}return table[table.length-1][0];}
function chance(p){return Math.random()<Math.max(0,Math.min(.98,p));}
function stripWindow(reelName,idx){var strip=REELS[reelName],n=strip.length;return [strip[(idx+n-1)%n],strip[idx%n],strip[(idx+1)%n]].map(function(k){return Object.assign({},SYMBOLS[k]);});}
function idxOf(reelName,sym,start){var strip=REELS[reelName],n=strip.length;for(var i=0;i<n;i++){var idx=(start+i)%n;if(strip[idx]===sym)return idx;}return start%n;}
function windowAt(reelName,sym,row){var idx=idxOf(reelName,sym,Math.floor(Math.random()*20));return stripWindow(reelName,(idx-row+1+20)%20);}
function mark(cell){cell.win=true;return cell;}
function gridFor(role){var g=[stripWindow('left',Math.floor(Math.random()*20)),stripWindow('middle',Math.floor(Math.random()*20)),stripWindow('right',Math.floor(Math.random()*20))];function set(c,r,s){g[c][r]=mark(Object.assign({},SYMBOLS[s]));}
 if(role==='REPLAY'||role==='BELL'||role==='SUIKA'||role==='AN'||role==='BAR'||role==='SEVEN'){var s=role==='SEVEN'?'SEVEN':role;g=[windowAt('left',s,1),windowAt('middle',s,1),windowAt('right',s,1)];set(0,1,s);set(1,1,s);set(2,1,s);return g;}
 if(role==='WEAK_CHERRY'){var r=Math.random()<.5?0:2;g[0]=windowAt('left','CH',r);g[1]=windowAt('middle','CH',1);g[2]=windowAt('right','CH',1);set(0,r,'CH');set(1,1,'CH');set(2,1,'CH');return g;}
 if(role==='STRONG_CHERRY'){var rr=Math.random()<.5?0:2;g[0]=windowAt('left','CH',rr);g[1]=windowAt('middle','CH',1);g[2]=windowAt('right','CH',rr===0?2:0);set(0,rr,'CH');set(1,1,'CH');set(2,rr===0?2:0,'CH');return g;}
 if(role==='CERTAIN_CHERRY'){g=[windowAt('left','CH',1),windowAt('middle','CH',1),windowAt('right','CH',1)];set(0,1,'CH');set(1,1,'CH');set(2,1,'CH');return g;}
 if(role==='CHANCE_WEAK'){var d=Math.random()<.5?0:2;g[0]=windowAt('left','SUIKA',d);g[1]=windowAt('middle','SUIKA',1);set(0,d,'SUIKA');set(1,1,'SUIKA');g[2][d===0?2:0].win=true;return g;}
 if(role==='CHANCE_STRONG'){g[0]=windowAt('left','SUIKA',1);g[1]=windowAt('middle','SUIKA',1);set(0,1,'SUIKA');set(1,1,'SUIKA');g[2][1].win=true;return g;}
 return g;}
function renderGrid(grid){grid=grid||state.grid||gridFor('REPLAY');R.forEach(function(reel,ci){reel.innerHTML=grid[ci].map(function(c){return '<div class="cell '+(c.win?'win':'')+'">'+symHtml(c)+'</div>';}).join('');});}
function filler(){var keys=['SEVEN','BELL','REPLAY','CH','SUIKA','V','BLANK','AN','BAR'];return SYMBOLS[keys[Math.floor(Math.random()*keys.length)]];}
function animate(i){if(state.stopped[i])return;R[i].innerHTML=[filler(),filler(),filler()].map(function(c){return '<div class="cell">'+symHtml(c)+'</div>';}).join('');setTimeout(function(){animate(i);},80+Math.random()*70);}
function log(t){state.logs.unshift(t);state.logs=state.logs.slice(0,100);renderLog();}
function renderLog(){$('log').innerHTML=state.logs.map(function(v){return '<p>'+esc(v)+'</p>';}).join('');}
function currentTable(){if(state.mode==='rush'||state.mode==='super')return WEIGHTS.rush;if(state.mode==='revBonus'||state.mode==='decisive')return WEIGHTS.bonus;if(state.mode==='harakiri'||state.mode==='drive')return WEIGHTS.judge;if(state.highRemain>0||state.comebackRemain>0)return WEIGHTS.high;return WEIGHTS.normal;}
function modeName(){return {normal:'通常',revBonus:'革命BONUS',decisive:'決戦BONUS',rush:'革命RUSH',super:'超革命RUSH',harakiri:'ハラキリCHANCE',drive:'ハラキリDRIVE'}[state.mode]||(state.highRemain>0?'高確':'通常');}
function enterRevBonus(reason){state.mode='revBonus';state.bonusG=50+(chance(.25)?10:0)+(chance(.08)?20:0);state.bonusPt=0;state.bonusGuaranteed=false;log('革命BONUS: '+reason);}
function enterDecisive(reason){state.mode='decisive';state.regBells=0;state.bonusPt=0;log('決戦BONUS: '+reason);}
function initRush(kind,reason){state.mode=kind;state.lastRush=kind;state.rushSet++;var base=10+Math.floor(Math.random()*91);if(kind==='rush'&&base<20)base=20;if(kind==='super')base=Math.min(150,Math.floor(base*1.5));state.rushG=base+(state.vStock>0?10*state.vStock:0);state.rushPt=0;state.vStock=0;state.atCount=(state.atCount||0)+1;log((kind==='super'?'超革命RUSH':'革命RUSH')+': '+reason+' / '+state.rushG+'G');}
function enterHarakiri(){state.mode='harakiri';state.harakiriG=3;log('ハラキリチャレンジ突入');}
function startComeback(){state.mode='normal';state.comebackRemain=66;state.normalG=0;log('66G引き戻し状態へ');}
function rarePower(role){return {WEAK_CHERRY:.12,STRONG_CHERRY:.42,CERTAIN_CHERRY:1,SUIKA:.10,CHANCE_WEAK:.18,CHANCE_STRONG:.55,AN:1,BAR:1,SEVEN:1}[role]||0;}
function normalHit(role){var p=rarePower(role)*.36*spec().bonus;if(state.comebackRemain>0)p+=role==='BELL'?.012:role==='REPLAY'?.006:rarePower(role)*.28;return chance(p);}
function resolveNormal(role){state.normalG++;if(state.highRemain>0)state.highRemain--;if(state.comebackRemain>0)state.comebackRemain--;if(role==='SUIKA'||role==='WEAK_CHERRY')state.highRemain=Math.max(state.highRemain,20);if(state.normalG>=500){state.normalG=0;enterRevBonus('天井500G');return;}if(state.comebackRemain>0&&normalHit(role)){initRush(state.lastRush==='super'?'super':(chance(.18)?'super':'rush'),'引き戻し成功');return;}if(normalHit(role)){state.normalG=0;if(role==='AN'||role==='BAR'||role==='SEVEN'||role==='CERTAIN_CHERRY'||chance(.42))enterRevBonus(ROLES[role].name);else enterDecisive(ROLES[role].name);}}
function resolveRevBonus(role){state.bonusG--;var add={BELL:14,REPLAY:4,WEAK_CHERRY:18,STRONG_CHERRY:36,CERTAIN_CHERRY:120,SUIKA:16,CHANCE_WEAK:24,CHANCE_STRONG:58,AN:120,BAR:100,SEVEN:160}[role]||0;state.bonusPt+=add;state.payout+=add;if(rarePower(role)&&chance(rarePower(role)*.28)){state.bonusG++;log(ROLES[role].name+' 減算STOP');}if(state.bonusPt>=666){state.bonusGuaranteed=true;if(rarePower(role)&&chance(rarePower(role)*.25)){state.vStock++;log('Vストック +1');}}if(state.bonusG<=0){if(state.bonusGuaranteed) initRush('rush','666pt到達'); else startComeback();}}
function resolveDecisive(role){var add=role==='BELL'?14:role==='REPLAY'?3:rarePower(role)?18:0;state.bonusPt+=add;state.payout+=add;if(role==='BELL')state.regBells++;if(state.regBells>=8){if(chance((.35+rarePower(role)*.45)*spec().success))initRush('rush','決戦突破');else startComeback();}}
function resolveRush(role){state.rushG--;state.rushPt+=7.2;state.payout+=7.2;if(role==='BELL'){state.rushPt+=4;state.payout+=4;}var add={WEAK_CHERRY:10,STRONG_CHERRY:30,CERTAIN_CHERRY:100,SUIKA:10,CHANCE_WEAK:20,CHANCE_STRONG:50,AN:100,BAR:80,SEVEN:120}[role]||0;if(add){state.rushG+=add;log(ROLES[role].name+' 上乗せ +'+add+'G');}if((role==='STRONG_CHERRY'||role==='CHANCE_STRONG'||role==='CERTAIN_CHERRY')&&chance(rarePower(role)*.18)){state.mode='drive';state.driveG=5;log('ハラキリDRIVE突入');return;}if(state.mode==='rush'&&state.rushSet>=4){state.mode='super';state.lastRush='super';log('超革命RUSH昇格');}if(state.rushG<=0){if(state.rushStock>0){state.rushStock--;initRush(state.mode,'ストック継続');}else enterHarakiri();}}
function resolveDrive(role){state.driveG--;var add=20+Math.floor(Math.random()*31);if(rarePower(role))add+=Math.floor(rarePower(role)*160);state.rushG+=add;log('DRIVE +'+add+'G');if(state.driveG<=0){state.mode=state.lastRush;}}
function resolveHarakiri(role){state.harakiriG--;var base=state.lastRush==='super'?.78:.58;var p=base+rarePower(role)*.38;if(chance(p)||state.harakiriG<=0&&chance(state.lastRush==='super'?.55:.32)){initRush(state.lastRush,'ハラキリ継続');return;}if(state.harakiriG<=0)startComeback();}
function resolve(role){state.lastRole=role;state.totalG++;if(state.mode==='normal')resolveNormal(role);else if(state.mode==='revBonus')resolveRevBonus(role);else if(state.mode==='decisive')resolveDecisive(role);else if(state.mode==='rush'||state.mode==='super')resolveRush(role);else if(state.mode==='drive')resolveDrive(role);else if(state.mode==='harakiri')resolveHarakiri(role);}
function spin(){if(state.spinning)return;if(state.mode==='normal'&&state.credit<3){log('クレジット不足');return;}if(state.mode==='normal'){state.credit-=3;state.invest+=3;}var role=state.forceRole||choose(currentTable());state.pendingRole=role;state.grid=gridFor(role);state.spinning=true;state.stopped=[false,false,false];$('resultText').textContent='回転中';$('effectText').textContent=ROLES[role].name+' を狙え';renderButtons();for(var i=0;i<3;i++)animate(i);scheduleAutoStops();}
function clearAutoTimers(){state.autoTimers.forEach(clearTimeout);state.autoTimers=[];}
function scheduleAutoStops(){clearAutoTimers();if(!state.auto||!state.spinning)return;[0,1,2].forEach(function(i){state.autoTimers.push(setTimeout(function(){stopReel(i);},360+i*230));});}
function stopReel(i){if(!state.spinning||state.stopped[i])return;state.stopped[i]=true;R[i].innerHTML=state.grid[i].map(function(c){return '<div class="cell '+(c.win?'win':'')+'">'+symHtml(c)+'</div>';}).join('');if(state.stopped.every(Boolean)){state.spinning=false;clearAutoTimers();resolve(state.pendingRole);state.pendingRole=null;render();if(state.auto)setTimeout(spin,430);}else renderButtons();}
function skip(){if(!state.spinning){spin();setTimeout(skip,120);return;}clearAutoTimers();for(var i=0;i<3;i++)if(!state.stopped[i])stopReel(i);}
function renderButtons(){['stop0','stop1','stop2'].forEach(function(id,i){$(id).disabled=!state.spinning||state.stopped[i];});$('spinBtn').disabled=state.spinning;$('autoBtn').className='btn auto '+(state.auto?'on':'');$('autoBtn').textContent=state.auto?'AUTO ON':'AUTO';}
function meterValue(){if(state.mode==='normal')return Math.min(100,state.normalG/500*100);if(state.mode==='revBonus')return Math.min(100,state.bonusPt/666*100);if(state.mode==='decisive')return state.regBells/8*100;if(state.mode==='rush'||state.mode==='super')return Math.min(100,state.rushG);if(state.mode==='harakiri')return state.harakiriG/3*100;if(state.comebackRemain>0)return state.comebackRemain/66*100;return 0;}
function renderMini(){var main=state.mode==='normal'?(state.comebackRemain>0?'引戻 '+state.comebackRemain+'G':(500-state.normalG)+'G'):state.mode==='revBonus'?state.bonusG+'G':state.mode==='decisive'?'NAVI '+state.regBells+'/8':state.mode==='rush'||state.mode==='super'?state.rushG+'G':state.mode==='harakiri'?state.harakiriG+'G':'DRIVE '+state.driveG+'G';$('miniMain').textContent=main;$('miniSub').innerHTML='<span>総G</span><b>'+state.totalG+'G</b><span>通常</span><b>'+state.normalG+'G</b><span>払出</span><b>'+Math.floor(state.payout)+'pt</b><span>差枚</span><b>'+Math.floor(state.payout-state.invest)+'pt</b>';}
function render(){var lr=state.lastRole?ROLES[state.lastRole].name:'-';$('mode').textContent=modeName()+' / 設定'+state.setting+' '+spec().target+'%';$('resultText').textContent=state.forceRole?'次回指定: '+ROLES[state.forceRole].name:(lr==='-'?'BETで開始':'成立: '+lr);var e=state.mode==='normal'?'天井まで '+(500-state.normalG)+'G'+(state.comebackRemain>0?' / 引き戻し '+state.comebackRemain+'G':''):state.mode==='revBonus'?'残り '+state.bonusG+'G / '+state.bonusPt+'pt / 666ptでRUSH':state.mode==='decisive'?'ベルナビ '+state.regBells+'/8 / バトル突破でRUSH':state.mode==='rush'||state.mode==='super'?'残り '+state.rushG+'G / SET '+state.rushSet:state.mode==='harakiri'?'3G高速継続ジャッジ':'3桁上乗せに期待';$('effectText').textContent=e;$('meter').style.width=meterValue()+'%';$('meters').innerHTML='<span>設定</span><strong>'+state.setting+' / '+spec().target+'%</strong><span>クレジット</span><strong>'+state.credit+'</strong><span>総ゲーム</span><strong>'+state.totalG+'G</strong><span>天井まで</span><strong>'+(500-state.normalG)+'G</strong><span>引き戻し</span><strong>'+(state.comebackRemain||'-')+'</strong><span>BONUS pt</span><strong>'+state.bonusPt+'</strong><span>RUSH G</span><strong>'+state.rushG+'</strong><span>RUSH SET</span><strong>'+state.rushSet+'</strong><span>Vストック</span><strong>'+state.vStock+'</strong><span>払出</span><strong>'+Math.floor(state.payout)+'pt</strong><span>差</span><strong>'+Math.floor(state.payout-state.invest)+'pt</strong>';renderMini();renderButtons();renderLog();buildSettingButtons();buildForceButtons();renderMenus();}
function buildRoleList(){var data=[['リプレイ','中段RP揃い'],['ベル','中段ベル揃い'],['弱チェリー','角CH・中中CH・右中CH'],['強チェリー','斜めCH'],['確定チェリー','中段3連CH'],['スイカ','中段スイカ揃い'],['チャンス目弱','斜め スイカ・スイカ・ANY'],['チャンス目強','横並び スイカ・スイカ・ANY'],['餡揃い','中段餡揃い'],['BAR揃い','中段BAR揃い'],['7揃い','中段7揃い']];$('roleList').innerHTML=data.map(function(d){return '<div class="role"><span>'+d[0]+'</span><b>'+d[1]+'</b></div>';}).join('');}
function buildSettingButtons(){var box=$('settingButtons');box.innerHTML=Object.keys(SETTINGS).map(function(k){return '<button data-setting="'+k+'" class="'+(String(state.setting)===k?'on':'')+'">設定'+k+' '+SETTINGS[k].target+'%</button>';}).join('');[].slice.call(box.querySelectorAll('button')).forEach(function(b){b.onclick=function(){state.setting=Number(b.getAttribute('data-setting'));log('設定'+state.setting+'へ変更');render();};});}
function buildForceButtons(){var box=$('forceButtons');box.innerHTML=Object.keys(ROLES).map(function(k){return '<button data-role="'+k+'" class="'+(state.forceRole===k?'on':'')+'">'+ROLES[k].name+'</button>';}).join('')+'<button data-role="" class="'+(!state.forceRole?'on':'')+'">自動抽選</button>';[].slice.call(box.querySelectorAll('button')).forEach(function(b){b.onclick=function(){state.forceRole=b.getAttribute('data-role')||null;render();};});}
function openMenu(name){state.activeMenu=name;$('drawer').classList.add('open');renderMenus();}
function renderMenus(){[].slice.call(document.querySelectorAll('.menu-btn')).forEach(function(b){b.classList.toggle('on',b.getAttribute('data-menu')===state.activeMenu);});[].slice.call(document.querySelectorAll('[data-panel]')).forEach(function(p){p.classList.toggle('hidden',p.getAttribute('data-panel')!==state.activeMenu);});$('drawerTitle').textContent={status:'ステータス',setting:'設定',force:'成立役指定',roles:'成立出目',log:'ログ'}[state.activeMenu]||'格納データ';}
$('spinBtn').onclick=spin;$('stop0').onclick=function(){stopReel(0);};$('stop1').onclick=function(){stopReel(1);};$('stop2').onclick=function(){stopReel(2);};$('skipBtn').onclick=skip;$('autoBtn').onclick=function(){state.auto=!state.auto;renderButtons();if(state.auto){if(state.spinning)scheduleAutoStops();else spin();}else clearAutoTimers();};$('closeDataBtn').onclick=function(){$('drawer').classList.remove('open');};$('saveBtn').onclick=function(){localStorage.setItem(STORAGE,JSON.stringify(state));log('保存しました');};$('resetBtn').onclick=function(){localStorage.removeItem(STORAGE);location.reload();};[].slice.call(document.querySelectorAll('.menu-btn')).forEach(function(b){b.onclick=function(){openMenu(b.getAttribute('data-menu'));};});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();state.spinning?skip():spin();}if(e.key==='1')stopReel(0);if(e.key==='2')stopReel(1);if(e.key==='3')stopReel(2);if(e.key==='Escape')$('drawer').classList.remove('open');});
buildRoleList();renderGrid();render();log('Wesker Machine 起動');
})();
