function navStripHtml(){var labels=['左','中','右'];if(state.navOrder){var dots=state.navOrder.map(function(i,idx){return '<span class="nav-label">'+labels[i]+'</span><span class="nav-dot">'+(idx+1)+'</span>';}).join('');return '<div class="nav-strip">'+dots+'</div>';}var text=state.mode==='revBonus'?'革命BONUS中':state.mode==='decisive'?'決戦BONUS中':state.mode==='rush'?'革命RUSH中':state.mode==='super'?'超革命RUSH中':state.mode==='cz'?'逆押しでVを狙え':state.mode==='czPrelude'?'CZ前兆中':state.mode==='harakiri'?'ハラキリCHANCE':state.mode==='drive'?'ハラキリDRIVE':'待機中';return '<div class="nav-strip">'+text+'</div>';}
function publicNextCheckpoint(g){return CHECKPOINTS.find(function(n){return g<n;})||1000;}
function renderCheckpoints(){var box=$('checkpointTrack');if(!box)return;if(state.mode!=='normal'){box.innerHTML=navStripHtml();return;}var g=state.normalG,nextPublic=publicNextCheckpoint(g);box.innerHTML=CHECKPOINTS.map(function(p){var cls='cp';if(p<=g)cls+=' hit';if(g<p&&p===nextPublic)cls+=' now';if(state.checkpointBlackouts&&state.checkpointBlackouts[p])cls+=' black';return '<div class="'+cls+'">'+p+'</div>';}).join('');}
function render(){var lr=state.lastRole?ROLES[state.lastRole].name:'-';var ceil=modeCeiling(),remain=Math.max(0,Math.ceil(ceil-state.normalG)),next=Math.max(0,Math.ceil(nextCzPoint(state.normalG)-state.normalG));$('mode').textContent=modeName();$('resultText').textContent=state.forceRole?'次回指定: '+ROLES[state.forceRole].name:(lr==='-'?'BETで開始':'成立: '+lr);var e=state.mode==='normal'?'通常 '+Math.floor(state.normalG)+'G / チェックポイント進行中'+(state.comebackRemain>0?' / 引き戻し '+state.comebackRemain+'G':''):state.mode==='czPrelude'?'CZ前兆 残り '+state.czPreludeG+'G':state.mode==='cz'?'逆押しでVを狙え / V揃いでBONUS':state.mode==='revBonus'?'残り '+state.bonusG+'G / '+state.bonusPt+'pt / 666ptでRUSH':state.mode==='decisive'?'ベルナビ '+state.regBells+'/8 / バトル突破でRUSH':state.mode==='rush'||state.mode==='super'?'残り '+state.rushG+'G / SET '+state.rushSet:state.mode==='harakiri'?'3G高速継続ジャッジ':'3桁上乗せに期待';$('effectText').textContent=e;$('meter').style.width=meterValue()+'%';$('meters').innerHTML='<span>設定</span><strong>'+state.setting+' / '+spec().target+'%</strong><span>通常モード</span><strong>'+state.normalMode+' / 最大'+ceil+'G</strong><span>次前兆</span><strong>'+next+'G</strong><span>天井まで</span><strong>'+remain+'G</strong><span>クレジット</span><strong>'+state.credit+'</strong><span>総ゲーム</span><strong>'+state.totalG+'G</strong><span>内部通常G</span><strong>'+Math.floor(state.normalG)+'G</strong><span>引き戻し</span><strong>'+(state.comebackRemain||'-')+'</strong><span>BONUS pt</span><strong>'+state.bonusPt+'</strong><span>RUSH G</span><strong>'+state.rushG+'</strong><span>RUSH SET</span><strong>'+state.rushSet+'</strong><span>Vストック</span><strong>'+state.vStock+'</strong><span>払出</span><strong>'+Math.floor(state.payout)+'pt</strong><span>差</span><strong>'+Math.floor(state.payout-state.invest)+'pt</strong>';renderMini();renderCheckpoints();renderButtons();renderLog();buildSettingButtons();buildForceButtons();renderMenus();}
function buildRoleList(){var data=[['通常リプレイ','中段リプレイ横並び'],['共闘リプレイ','上段リプレイ横並び'],['共通ベル15pt','斜め下がり ベル・ベル・ベル'],['共通ベル3pt','斜め上がり ベル・ベル・ベル'],['弱チェリー3pt','左下段チェリー・中ANY・右中段リプレイ'],['強チェリー3pt','左下段チェリー・中ANY・右中段リプレイ否定'],['スイカ3pt','左上段・中中段・右下段'],['共闘スイカ3pt','中段スイカ横並び'],['チャンス目3pt','中段リプ・リプ・スイカ / 左上スイカ・中中スイカ・右中スイカ'],['777揃い','中段7・7・7 / 革命BONUS'],['V揃い','特殊役 / 左全V・中CH/V/スイカ・右スイカ/ベル/V'],['77BAR','中段7・7・BAR / 決戦BONUS']];$('roleList').innerHTML=data.map(function(d){return '<div class="role"><span>'+d[0]+'</span><b>'+d[1]+'</b></div>';}).join('');}
function buildSettingButtons(){var box=$('settingButtons');box.innerHTML=Object.keys(SETTINGS).map(function(k){return '<button data-setting="'+k+'" class="'+(String(state.setting)===k?'on':'')+'">設定'+k+' '+SETTINGS[k].target+'%</button>';}).join('');[].slice.call(box.querySelectorAll('button')).forEach(function(b){b.onclick=function(){state.setting=Number(b.getAttribute('data-setting'));state.comebackRemain=0;resetNormal('設定変更');log('設定'+state.setting+'へ変更');render();};});}
function buildForceButtons(){var box=$('forceButtons');var keys=Object.keys(ROLES).filter(function(k){return k!=='CZ_FAIL';});box.innerHTML=keys.map(function(k){return '<button data-role="'+k+'" class="'+(state.forceRole===k?'on':'')+'">'+ROLES[k].name+'</button>';}).join('')+'<button data-role="" class="'+(!state.forceRole?'on':'')+'">自動抽選</button>';[].slice.call(box.querySelectorAll('button')).forEach(function(b){b.onclick=function(){state.forceRole=b.getAttribute('data-role')||null;render();};});}
function openMenu(name){state.activeMenu=name;$('drawer').classList.add('open');renderMenus();}
function renderMenus(){[].slice.call(document.querySelectorAll('.menu-btn')).forEach(function(b){b.classList.toggle('on',b.getAttribute('data-menu')===state.activeMenu);});[].slice.call(document.querySelectorAll('[data-panel]')).forEach(function(p){p.classList.toggle('hidden',p.getAttribute('data-panel')!==state.activeMenu);});$('drawerTitle').textContent={status:'ステータス',setting:'設定',force:'成立役指定',roles:'成立出目',log:'ログ'}[state.activeMenu]||'格納データ';}
$('spinBtn').onclick=spin;$('stop0').onclick=function(){stopReel(0);};$('stop1').onclick=function(){stopReel(1);};$('stop2').onclick=function(){stopReel(2);};$('skipBtn').onclick=skip;$('autoBtn').onclick=function(){state.auto=!state.auto;if(state.auto)state.speed=false;renderButtons();if(state.auto){if(state.spinning)scheduleAutoStops();else spin();}else clearAutoTimers();};$('speedBtn').onclick=function(){state.speed=!state.speed;state.auto=state.speed;renderButtons();if(state.auto){if(state.spinning)scheduleAutoStops();else spin();}else clearAutoTimers();};$('closeDataBtn').onclick=function(){$('drawer').classList.remove('open');};$('saveBtn').onclick=function(){localStorage.setItem(STORAGE,JSON.stringify(state));log('保存しました');};$('resetBtn').onclick=function(){localStorage.removeItem(STORAGE);location.reload();};[].slice.call(document.querySelectorAll('.menu-btn')).forEach(function(b){b.onclick=function(){openMenu(b.getAttribute('data-menu'));};});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();state.spinning?skip():spin();}if(e.key==='1')stopReel(0);if(e.key==='2')stopReel(1);if(e.key==='3')stopReel(2);if(e.key==='Escape')$('drawer').classList.remove('open');});
buildRoleList();renderGrid();render();log('Wesker Machine 起動');
})();
